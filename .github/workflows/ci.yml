name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy pytest pytest-cov types-requests matplotlib pyyaml

      - name: Ruff lint
        run: ruff check src/

      - name: Mypy type check
        run: mypy src/ --strict --ignore-missing-imports

      # Tests that require processed parquet files (data/processed/*.parquet) are
      # guarded with @pytest.mark.skipif(not <path>.exists(), ...) and auto-skip in CI
      # since the data files are gitignored and generated by the multi-hour pipeline.
      # Unit tests covering pure math and stateless functions always run.
      - name: Pytest
        run: pytest tests/ -v --tb=short
